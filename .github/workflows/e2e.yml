name: E2E

# End-to-end test suite. Two jobs, mutually exclusive on event:
#
#   - `pr-smoke` runs on every PR. Small toolchain footprint (Go +
#     Node + docker), no network-gated tests. Target < 2 min so PR
#     authors get fast feedback.
#
#   - `full-matrix` runs on every push to main. Installs every
#     toolchain bento ships an adapter for and sets
#     BENTO_E2E_NETWORK=1 so the network-gated recipes execute
#     rather than emitting skip markers. This is the green-state
#     signal `release.yml` relies on: tag a commit that's already
#     gone green on main full-matrix and the release flow doesn't
#     need to re-run the matrix.
#
# Separate from `ci.yml` (unit + clippy + fmt + cross-build) because
# e2e is fatter, slower, and higher-variance — keeping the badges
# split means `ci.yml` stays the merge gate while this workflow
# surfaces richer regressions.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel in-flight runs for the same ref when a new push lands —
# saves runner minutes on rapid iteration.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  pr-smoke:
    name: e2e smoke
    # PR-only. Post-merge coverage on main lives in `full-matrix`
    # below, which exercises a strict superset of what smoke covers.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: e2e-pr-smoke

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.22'
          cache: false # rust-cache above owns target/; go toolchain's
                       # module cache is fine to rebuild each run.

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      # docker is preinstalled on ubuntu-latest — we rely on it for
      # the container-go smoke. Explicit version print helps when
      # debugging the occasional runner-image regression.
      - name: Docker sanity
        run: docker --version

      # The e2e harness materialises every fixture into a tempdir
      # and invokes the release-built bento binary. We build once
      # here + test once; rust-cache keeps target/ warm across runs.
      - name: cargo test --release --test e2e
        run: cargo test --release --test e2e --locked

  full-matrix:
    name: e2e full-matrix
    # Main pushes only. PR coverage lives in `pr-smoke` above (fast,
    # narrower toolchain set); release.yml trusts main's green state
    # on this job rather than re-running the matrix at tag time.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      BENTO_E2E_NETWORK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: e2e-full-matrix

      # Go.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.22'
          cache: false

      # Node + the three package managers bento ships adapters for.
      # setup-node handles npm; pnpm / yarn are explicit.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: '9'
      - name: Install yarn
        run: npm install --global yarn

      # Bun + Deno.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      # Python + the `build` frontend so python-build fixture's
      # network-gated tests pass rather than skip.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install Python build
        run: python -m pip install --upgrade pip build

      # Ruby + bundler for rubygems-fetching tests.
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: false # fixture writes its own Gemfile;
                               # bundler install happens per test

      # PHP + Composer.
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          tools: composer

      # Java (for Maven + Gradle).
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Install Maven
        run: |
          if ! command -v mvn >/dev/null; then
            sudo apt-get update && sudo apt-get install -y maven
          fi
          mvn -version

      # .NET. Pin 8.0.x: the fixture targets net8.0 and an 8.0.x SDK
      # bundles that targeting pack, so restore stays offline-safe.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Docker sanity
        run: docker --version

      - name: cargo test --release --test e2e
        run: cargo test --release --test e2e --locked
