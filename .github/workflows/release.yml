name: Release

on:
  push:
    tags:
      # Match immutable patches (`v0.1.0`, `v1.2.3`) AND prereleases
      # (`v0.1.0-rc1`, `v1.0.0-beta.2`). Deliberately does NOT match
      # floating major-minor tags (`v0.1`, `v1.0`) — those get retargeted
      # by the `Move floating minor tag` step below, and a re-release on
      # the floating tag would be a wasteful duplicate of the patch one.
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.1)'
        required: true

# Default to read-only; only the `release` job widens it (below) to what
# publishing actually needs. A compromised build step then can't push a
# tag or mutate a release.
permissions:
  contents: read

jobs:
  # ── Preflight ──────────────────────────────────────────────────────
  #
  # Re-runs the same gates `ci.yml` runs, on the exact tagged commit,
  # before any release artefact is built. Defensive sanity check that
  # the tagged SHA still passes fmt + clippy + unit tests.
  #
  # The heavier e2e full-matrix is NOT in this workflow — it runs on
  # every push to main (`e2e.yml`'s full-matrix job), so by the time
  # you tag, main is already green on the full toolchain matrix.
  # Putting full-matrix here too would just duplicate that signal at
  # release time. The release flow trusts main's green state.
  #
  # Implication: tag from a commit that's already on main AND has
  # passed full-matrix. The version-bump commit (`chore(release):
  # vX.Y.Z`) is itself a main commit, so push it and wait for the
  # main full-matrix run to go green before pushing the tag.
  preflight:
    name: preflight (fmt + clippy + tests on tagged commit, ${{ matrix.os }})
    # macOS is a release target but ci.yml only cross-*builds* it — nothing
    # runs the test suite on Darwin until here. Last gate before artefacts.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      # A workflow_dispatch release builds whatever `tag` points at, so the
      # tag is the only statement of intent — cross-check it against the
      # version the binaries will actually report.
      - name: Assert tag matches workspace version
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          tag_version="${TAG#v}"
          if [ "$tag_version" != "$version" ] && [ "${tag_version%%-*}" != "$version" ]; then
            echo "::error::tag '$TAG' does not match workspace.package.version '$version'"
            exit 1
          fi
          echo "tag $TAG matches workspace version $version"

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-preflight-${{ matrix.os }}

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        env:
          RUSTFLAGS: -D warnings
        run: cargo clippy --workspace --all-targets --locked

      - name: cargo build (workspace, primes bin fixtures for tests)
        run: cargo build --workspace --locked

      - name: cargo test
        # `--test-threads=1` matches ci.yml — plugin_e2e.rs spawns
        # 10 subprocess plugins per test and races on shared CI runners.
        run: cargo test --workspace --locked -- --test-threads=1

  build:
    name: build ${{ matrix.target }}
    needs: preflight
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: false
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: true
          # Static musl builds so the binary runs on Alpine-based CI
          # images, where the glibc tarball dies on a missing ld-linux
          # loader with a bare "not found".
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            runner: macos-latest
            cross: false
          - target: aarch64-apple-darwin
            runner: macos-latest
            cross: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve version from ref
        id: version
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ "$TAG" =~ ^v(.+)$ ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "::error::tag '$TAG' must look like v<semver>"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-${{ matrix.target }}

      - name: Install cross (linux cross-targets only)
        if: matrix.cross
        run: cargo install cross --locked --version 0.2.5

      - name: Build release binaries
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }} -p bento-cli -p bento-mcp
          else
            cargo build --release --locked --target ${{ matrix.target }} -p bento-cli -p bento-mcp
          fi

      - name: Package tarball
        id: package
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          target="${{ matrix.target }}"
          asset="bento-${version}-${target}"

          stage="$(mktemp -d)"
          mkdir -p "$stage/${asset}"
          cp "target/${target}/release/bento"     "$stage/${asset}/bento"
          cp "target/${target}/release/bento-mcp" "$stage/${asset}/bento-mcp"
          cp README.md LICENSE-MIT LICENSE-APACHE CHANGELOG.md "$stage/${asset}/"

          # Ship the Claude Code skill bundle alongside the binaries so
          # `install.sh` can drop it under ~/.claude/skills/bento/.
          # SKILL.md + the bento-guard PreToolUse hook are what make a
          # fresh agent reach for `bento <verb>` instead of native
          # package managers without the user having to remind it.
          mkdir -p "$stage/${asset}/skills/bento"
          cp -r skills/bento/. "$stage/${asset}/skills/bento/"

          mkdir -p dist
          tar -C "$stage" -czf "dist/${asset}.tar.gz" "${asset}"
          (cd dist && shasum -a 256 "${asset}.tar.gz" > "${asset}.tar.gz.sha256")

          echo "asset=${asset}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.asset }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release + move the floating minor tag
      id-token: write # OIDC token the attestation is signed against
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve version from ref
        id: version
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ "$TAG" =~ ^v(.+)$ ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "::error::tag '$TAG' must look like v<semver>"
            exit 1
          fi
          # github.sha is the *branch* head on workflow_dispatch; the
          # floating-tag move below has to target the tagged commit.
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: bento-*
          merge-multiple: true

      - name: Aggregate checksums
        working-directory: dist
        run: |
          # `--` so a hypothetical asset name beginning with `-` can't
          # be parsed as a flag (shellcheck SC2035).
          cat -- *.sha256 > SHA256SUMS
          ls -la

      # Signed, verifiable statement that these exact bytes came out of
      # this workflow at this commit: `gh attestation verify <tarball>
      # --repo bento-sh/bento`. Covers SHA256SUMS too, so the checksum
      # file consumers trust is itself attested.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: bento ${{ steps.version.outputs.tag }}
          body: |
            ## Install

            ```sh
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ steps.version.outputs.tag }}/install.sh | sh -s -- ${{ steps.version.outputs.version }}
            ```

            See the [CHANGELOG](https://github.com/${{ github.repository }}/blob/${{ steps.version.outputs.tag }}/CHANGELOG.md) for what's new.

            ### Artifacts

            Prebuilt binaries + checksums for every supported target are
            attached to this release, each with a signed build-provenance
            attestation:

            ```sh
            gh attestation verify bento-${{ steps.version.outputs.version }}-<target>.tar.gz --repo ${{ github.repository }}
            ```
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/SHA256SUMS
          generate_release_notes: true
          # A hyphen in the tag (v0.1.0-rc1) means prerelease — never
          # promote one to `latest`, which is what install.sh resolves.
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
          make_latest: ${{ !contains(steps.version.outputs.tag, '-') }}

      # Move the floating minor tag (e.g. `v0.1`) to this commit so the
      # Marketplace listing — published once against `v0.1` — always
      # resolves to the latest v0.1.x patch. Consumers pin
      # `uses: bento-sh/bento@v0.1` and get updates automatically;
      # the immutable `v0.1.Z` tag stays put for audit/rollback.
      #
      # Skipped for pre-release tags (anything with a hyphen, e.g.
      # v0.1.0-rc1) so release candidates don't retarget the stable
      # floating tag.
      - name: Move floating minor tag
        shell: bash
        env:
          FULL_TAG: ${{ steps.version.outputs.tag }}
          COMMIT_SHA: ${{ steps.version.outputs.sha }}
        run: |
          if [[ "$FULL_TAG" == *-* ]]; then
            echo "skipping floating-tag move for pre-release $FULL_TAG"
            exit 0
          fi
          if [[ ! "$FULL_TAG" =~ ^(v[0-9]+\.[0-9]+)\.[0-9]+$ ]]; then
            echo "skipping: $FULL_TAG is not a strict vMAJOR.MINOR.PATCH tag"
            exit 0
          fi
          minor="${BASH_REMATCH[1]}"
          echo "moving floating tag '$minor' to commit $COMMIT_SHA"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$minor" "$COMMIT_SHA"
          git push origin "$minor" --force
