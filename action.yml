name: Bento CI
description: Run a bento (plan + execute with content-hash caching) in GitHub Actions.
author: Disruptor Labs

# Runner support: ubuntu-* and macos-* only. Windows runners are NOT
# supported — every step is `shell: bash`, the helper script is a POSIX
# shell script, and no Windows binary is published (v0.2). On Windows,
# `cargo install bento-cli` and invoke bento directly instead of using
# this action. Alpine-based container jobs are fine: the installer
# picks the static musl tarball when it sees a musl libc.

branding:
  icon: box
  color: orange

inputs:
  bento:
    description: Bento name to run (omit to run every bento in the workspace).
    required: false
    default: ''

  task:
    description: >
      Task to run — one of 'ci' (default), 'build', 'check', 'test',
      'lint', 'deploy', or 'notify'. The `check` task runs the
      adapter-native fast type-check (`cargo check --locked
      --all-targets`, `go vet ./...`, …); useful as a cheap PR gate
      ahead of the full build. The `deploy` task runs `bento doctor
      --env <env>` first (preflight) then `bento deploy` with
      whatever deploy-scoped inputs are set (env / secret-from /
      preview / rollback). The `notify` task replays Notify-kind
      integration tasks (Slack posts, Linear flips, …) against the
      last deploy's cached payload — used to re-send after a broken
      webhook is fixed without re-deploying the code.
    required: false
    default: 'ci'

  target:
    description: >
      Bento or dish name passed to build / check / test / lint /
      deploy (ignored for 'ci'). For `deploy`, omit to run against
      every dish with a matching integration.
    required: false
    default: ''

  env:
    description: >
      Named bento environment from `bento.toml`'s
      `[environments.<name>]`. With `task: deploy`, the profile's
      `secrets.*` map is applied as declared-var → source-var
      aliases so tokens can live under any host env-var name
      (`RAILWAY_TOKEN_STAGING` / `RAILWAY_TOKEN_PROD`) and bento
      remaps them to what integrations expect (`RAILWAY_TOKEN`).
      Also drives `bento doctor --env <env>` in preflight.
      Ignored for non-deploy tasks.
    required: false
    default: ''

  secret-from:
    description: >
      Newline-separated DECLARED=SOURCE aliases (see `bento deploy
      --secret-from`). Each non-empty line becomes one `--secret-from`
      flag. Overrides anything coming from `env`. Intended for
      ad-hoc deploys where a named profile in bento.toml isn't
      worth the config churn. Ignored for non-deploy tasks.
    required: false
    default: ''

  preview:
    description: >
      With `task: deploy`, run preview / staging-style deploys
      (--preview). Mutually exclusive with `rollback`.
    required: false
    default: 'false'

  rollback:
    description: >
      With `task: deploy`, roll back to the previous deploy
      (--rollback). Mutually exclusive with `preview`.
    required: false
    default: 'false'

  no-notify:
    description: >
      With `task: deploy`, skip the Notify-kind garnish fan-out
      (--no-notify). Use when re-deploying after a fix and you
      don't want to re-spam the same Slack / Linear channel.
      Ignored for non-deploy tasks.
    required: false
    default: 'false'

  version:
    description: >
      bento version to install (e.g. '0.1.0'). When set, the action downloads
      the prebuilt binary from GitHub Releases instead of compiling from source
      — much faster. Omit to fall back to `cargo install` from `source-path`.
    required: false
    default: ''

  github-repo:
    description: >
      Repo to pull bento releases from. Only used when `version` is set.
    required: false
    default: 'bento-sh/bento'

  source-path:
    description: >
      Path to a bento Rust workspace (Cargo.toml root). Only consulted when
      `version` is empty — falls back to `cargo install` from source. Leave
      blank to force an error if no binary version is pinned.
    required: false
    default: ''

  workspace-path:
    description: >
      Path to the repo directory that contains `bento.toml` and `bentos/`.
      Defaults to `$GITHUB_WORKSPACE` (the checkout root).
    required: false
    default: ''

  json:
    description: Emit machine-readable JSON to the step's stdout instead of
      the human summary. Useful for downstream parsing.
    required: false
    default: 'false'

  cache-token:
    description: >
      JWT for the hosted remote cache (`[cache] remote =
      "bento://…"` in bento.toml). Get it from `bento login` or the
      dashboard, store it as a repo secret, and pass that secret
      here. Without it a workspace configured for the hosted cache
      silently falls back to the local + actions/cache tiers — hits
      on laptops, none in CI. Leave empty if the workflow already
      exports the token env var itself; an empty input never
      clobbers it.
    required: false
    default: ''

  job-summary:
    description: >
      When 'true' (default), append a run summary to the job's
      $GITHUB_STEP_SUMMARY — headline counts plus a per-task table
      (dish, task, outcome, cache key, duration) and the stderr
      excerpt of anything that failed. Needs `jq` on the runner
      (standard on GitHub-hosted images); skipped silently if absent.
    required: false
    default: 'true'

  pr-comment:
    description: >
      Sticky pull-request comment carrying the same report as the job
      summary — one comment per PR, edited in place on every push.
      'auto' (default) comments on `pull_request` events only;
      'always' also comments on other events when a PR can be
      resolved for the ref; 'never' disables it.

      The calling job must grant `permissions: pull-requests: write`
      and the token reaches `gh` through the `github-token` input
      (default: the workflow token). Anything that goes wrong —
      missing token, read-only permissions, API error — is a
      `::warning::`, never a job failure.
    required: false
    default: 'auto'

  github-token:
    description: >
      Token used for the `pr-comment` step. Defaults to the workflow's
      own token, which still needs `permissions: pull-requests: write`
      on the calling job. Pass a PAT to comment as a different account
      (e.g. a bot with an avatar).
    required: false
    default: ${{ github.token }}

  cache-key-suffix:
    description: >
      Extra key component appended to the bento cache key. Bump it to force
      a cold cache (e.g. after bento version upgrades).
    required: false
    default: 'v1'

  install-toolchains:
    description: >
      When 'true' (default), runs `bento toolchain install` to fetch every
      pinned toolchain into ~/.bento/tools/, with an actions/cache@v4
      wrapping that dir keyed on the workspace's bento.toml + dish.toml +
      .tool-versions content. Bento's adapters then transparently use the
      installed versions for every task.

      Bento's built-in installers cover Go, Node, Python (delegated to
      `uv python install`), and uv (declared co-required by the python
      tool, so a `[toolchain] python = "..."` pin lays uv down first
      automatically). For tools without a built-in installer —
      currently `bun` and `deno` — the action bootstraps from the
      pinned upstream GitHub release asset, checksum-verified, before
      invoking bento, when those tools are pinned in `bento.toml`'s
      `[toolchain]` block.

      When 'false', skip both the install step and its cache. Assumes
      you've set up the right tool versions via actions/setup-* steps
      before invoking bento, and (typically) that your bento.toml has
      `[toolchain] use_system = true` so bento doesn't try to install.
    required: false
    default: 'true'

outputs:
  json:
    description: "Raw JSON report (set only when `json: true`). Same content as `report`; kept for back-compat."
    value: ${{ steps.execute.outputs.json }}

  report:
    description: >
      Full ExecutionReport JSON — task results, cache hit/miss per task,
      durations, dish-and-task taxonomy. Always set after a bento run,
      whether `json` is true or not. Same shape as `bento ci --json`;
      see `bento schema report` for the canonical JSON Schema.
    value: ${{ steps.execute.outputs.report }}

  artifacts:
    description: >
      JSON object `{dish_name: [absolute_paths...]}` listing every file/dir
      resolved from each dish's `[outputs]` declaration after the run.
      Pipe to `jq` from a downstream step (Docker build, upload-artifact,
      release upload, etc.). Empty `{}` if nothing matched.
    value: ${{ steps.execute.outputs.artifacts }}

  cache-hits:
    description: Tasks restored from cache (`summary.hits`). Empty if `jq` isn't on the runner.
    value: ${{ steps.execute.outputs.cache-hits }}

  cache-misses:
    description: Tasks that actually ran (`summary.built`). Empty if `jq` isn't on the runner.
    value: ${{ steps.execute.outputs.cache-misses }}

  failed:
    description: Tasks that failed (`summary.failed`). Empty if `jq` isn't on the runner.
    value: ${{ steps.execute.outputs.failed }}

  toolchains-installed:
    description: >
      JSON listing toolchains installed by the auto-install step. Set only
      when `install-toolchains: true`. Same shape as
      `bento toolchain install --json`: `{"installed": [{tool, version,
      bin_dir, used_by | co_required_for}], "skipped": [{tool, version,
      used_by, reason}], "failed": <count>}`. Co-required tools (e.g.
      uv when python is pinned) appear in `installed` with
      `co_required_for` instead of `used_by`. The `skipped` array
      lists pinned tools that bento doesn't install natively (today:
      `bun`, `deno`); the composite action falls back to the pinned
      upstream release asset for those before this step runs.
    value: ${{ steps.install-toolchains.outputs.json }}

runs:
  using: composite
  steps:
    # Inputs reach every `run:` block through `env:`, never through
    # `${{ }}` interpolation: a template substitution is pasted into the
    # script before bash sees it, so a caller passing `"; curl evil | sh
    # #` would execute it.
    - name: Resolve workspace path
      id: resolve
      shell: bash
      env:
        WORKSPACE_PATH: ${{ inputs.workspace-path }}
      run: |
        if [ -n "$WORKSPACE_PATH" ]; then
          path="$WORKSPACE_PATH"
        else
          path="${GITHUB_WORKSPACE}"
        fi
        echo "path=$path" >> "$GITHUB_OUTPUT"

    - name: Validate inputs
      shell: bash
      env:
        BENTO_VERSION: ${{ inputs.version }}
        SOURCE_PATH: ${{ inputs.source-path }}
      run: |
        if [ -z "$BENTO_VERSION" ] && [ -z "$SOURCE_PATH" ]; then
          echo "::error::either 'version' (download binary) or 'source-path' (build from source) must be set"
          exit 1
        fi

    - name: Install bento from release binary
      if: inputs.version != ''
      shell: bash
      env:
        BENTO_VERSION: ${{ inputs.version }}
        BENTO_REPO: ${{ inputs.github-repo }}
        BENTO_INSTALL_DIR: ${{ runner.temp }}/bento-install/bin
        # gh CLI picks up GITHUB_TOKEN and handles auth for both
        # public and private releases without us wrangling API
        # redirects.
        GH_TOKEN: ${{ github.token }}
      run: bash "${{ github.action_path }}/scripts/action/run.sh" install-bento

    - name: Install Rust toolchain (stable)
      if: inputs.version == ''
      uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
      with:
        toolchain: stable

    - name: Cache Cargo registry, git index, and build
      if: inputs.version == ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          ${{ inputs.source-path }}/target
        key: bento-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(format('{0}/Cargo.lock', inputs.source-path)) }}
        restore-keys: |
          bento-cargo-${{ runner.os }}-${{ runner.arch }}-

    - name: Build bento CLI from source (fallback)
      if: inputs.version == ''
      shell: bash
      working-directory: ${{ inputs.source-path }}
      run: cargo install --path crates/bento-cli --locked --root "${HOME}/.bento-install"

    - name: Add bento to PATH (source-build path)
      if: inputs.version == ''
      shell: bash
      run: echo "${HOME}/.bento-install/bin" >> "$GITHUB_PATH"

    - name: Restore bento content cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bento/cache
        key: bento-cache-${{ inputs.cache-key-suffix }}-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
        restore-keys: |
          bento-cache-${{ inputs.cache-key-suffix }}-${{ runner.os }}-${{ runner.arch }}-

    # Cache the package managers' OWN global download caches. This is
    # what speeds up cache misses — when bento decides a task needs to
    # actually run (source changed), the underlying tool (mvn / composer
    # / npm / cargo / ...) finds its dependencies pre-downloaded.
    # actions/cache@v4 silently skips non-existent paths, so caching all
    # of these is free for languages this workspace doesn't use.
    - name: Restore per-tool dependency caches
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          ~/.npm
          ~/.local/share/pnpm/store
          ~/.bun/install/cache
          ~/.cache/deno
          ~/.cache/pip
          ~/.cache/uv
          ~/.cache/composer
          ~/.m2/repository
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: bento-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/go.sum', '**/package-lock.json', '**/pnpm-lock.yaml', '**/yarn.lock', '**/bun.lock', '**/bun.lockb', '**/composer.lock', '**/pom.xml', '**/Cargo.lock', '**/poetry.lock', '**/uv.lock', '**/Gemfile.lock', '**/build.gradle', '**/build.gradle.kts', '**/gradle/libs.versions.toml') }}
        restore-keys: |
          bento-deps-${{ runner.os }}-${{ runner.arch }}-

    - name: Restore toolchain cache
      if: inputs.install-toolchains == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bento/tools
        # Hash every TOML and .tool-versions file in the workspace —
        # together they capture every place a [toolchain] block or
        # version pin can live (bento.toml, per-dish dish.toml, asdf/mise
        # .tool-versions, .ruby-version-style files via .tool-versions
        # equivalents).
        key: bento-toolchains-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/bento.toml', '**/dish.toml', '**/.tool-versions') }}
        restore-keys: |
          bento-toolchains-${{ runner.os }}-${{ runner.arch }}-

    - name: Install pinned toolchains
      id: install-toolchains
      if: inputs.install-toolchains == 'true'
      shell: bash
      working-directory: ${{ steps.resolve.outputs.path }}
      run: bash "${{ github.action_path }}/scripts/action/run.sh" install-toolchains

    # Preflight before a real deploy. Doctor surfaces missing env
    # vars / CLI binaries / bad config so the failure shape is
    # "integration.railway.env fail: RAILWAY_TOKEN not set" rather
    # than a cryptic 401 mid-upload. Only runs for task: deploy —
    # other tasks don't need the extra roundtrip.
    - name: Bento doctor (deploy preflight)
      if: inputs.task == 'deploy'
      shell: bash
      working-directory: ${{ steps.resolve.outputs.path }}
      env:
        BENTO_ENV: ${{ inputs.env }}
        BENTO_SECRET_FROM: ${{ inputs.secret-from }}
      run: bash "${{ github.action_path }}/scripts/action/run.sh" preflight

    - name: Execute bento
      id: execute
      shell: bash
      working-directory: ${{ steps.resolve.outputs.path }}
      env:
        # Route inputs through env vars (not direct template
        # substitution) so injection-shaped inputs can't shell out.
        BENTO_TASK: ${{ inputs.task }}
        BENTO_TARGET: ${{ inputs.target }}
        BENTO_NAME: ${{ inputs.bento }}
        BENTO_JSON: ${{ inputs.json }}
        BENTO_ENV: ${{ inputs.env }}
        BENTO_SECRET_FROM: ${{ inputs.secret-from }}
        BENTO_PREVIEW: ${{ inputs.preview }}
        BENTO_ROLLBACK: ${{ inputs.rollback }}
        BENTO_NO_NOTIFY: ${{ inputs.no-notify }}
        BENTO_JOB_SUMMARY: ${{ inputs.job-summary }}
        # Deliberately not named BENTO_CACHE_TOKEN: a step-level env
        # entry shadows the caller's own export even when empty, so
        # binding the input directly would unset a token the workflow
        # provided itself. run.sh promotes it only when non-empty.
        BENTO_CACHE_TOKEN_INPUT: ${{ inputs.cache-token }}
        REPORT_FILE: ${{ runner.temp }}/bento-report.json
      run: bash "${{ github.action_path }}/scripts/action/run.sh" execute

    # `always()` because a red run is exactly when the comment is worth
    # reading. The phase itself always exits 0 — the job's status stays
    # whatever `execute` made it.
    - name: Comment on the pull request
      if: always() && inputs.pr-comment != 'never'
      shell: bash
      working-directory: ${{ steps.resolve.outputs.path }}
      env:
        BENTO_PR_COMMENT: ${{ inputs.pr-comment }}
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPORT_FILE: ${{ runner.temp }}/bento-report.json
      run: bash "${{ github.action_path }}/scripts/action/run.sh" pr-comment
